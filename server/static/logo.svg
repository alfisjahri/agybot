  </defs>
  <!-- Rounded body, agy-like mark -->
  <rect x="56" y="56" width="400" height="400" rx="120" fill="url(#bg)"/>
  <!-- Face plate -->
  <rect x="116" y="150" width="280" height="212" rx="80" fill="url(#face)" opacity="0.96"/>
  <!-- Eyes -->
  <ellipse cx="206" cy="246" rx="34" ry="42" fill="#1B2A4A"/>
  <circle cx="216" cy="232" r="12" fill="#FFFFFF"/>
  <ellipse cx="306" cy="246" rx="34" ry="42" fill="#1B2A4A"/>
  <circle cx="316" cy="232" r="12" fill="#FFFFFF"/>
  <!-- Smile -->
  <path d="M 222 302 Q 256 326 290 302" stroke="#1B2A4A" stroke-width="12" stroke-linecap="round" fill="none"/>
  <!-- Antenna -->
  <line x1="256" y1="56" x2="256" y2="18" stroke="#7B5CFF" stroke-width="14" stroke-linecap="round"/>
  <circle cx="256" cy="14" r="12" fill="#FF7A1A"/>
</svg>
