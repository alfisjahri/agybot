<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>AgyBot — Chat</title>
<link rel="stylesheet" href="/static/style.css?v=10">
<link rel="stylesheet" href="/static/katex/katex.min.css">
<script src="/static/katex/katex.min.js"></script>
</head>
<body>
<!-- Topbar (Phase 8): brand + nav Chat/Routines/Usage & Kuota, semua di-center.
     Nav pindah dari sidebar ke atas, gabung dengan header AgyBot. -->
<header class="topbar">
  <div class="topbar-inner">
    <a class="topbar-brand" href="/"><img src="/logo.svg" alt="AgyBot"><b>AgyBot</b></a>
    <nav class="topbar-nav" aria-label="Halaman">
      <a href="/" class="active"><span class="ico"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 11.5a8.38 8.38 0 0 1-.9 3.8 8.5 8.5 0 0 1-7.6 4.7 8.38 8.38 0 0 1-3.8-.9L3 21l1.9-5.7a8.38 8.38 0 0 1-.9-3.8 8.5 8.5 0 0 1 4.7-7.6 8.38 8.38 0 0 1 3.8-.9h.5a8.48 8.48 0 0 1 8 8v.5z"/></svg></span> Chat</a>
      <a href="/routines"><span class="ico"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/></svg></span> Routines</a>
      <a href="/usage"><span class="ico"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><line x1="18" y1="20" x2="18" y2="10"/><line x1="12" y1="20" x2="12" y2="4"/><line x1="6" y1="20" x2="6" y2="14"/></svg></span> Usage &amp; Kuota</a>
    </nav>
  </div>
</header>
<div class="dsb-frame" id="frame">
  <aside class="dsb-side">
    <div class="dsb-side-top">
      <button class="bt-round" id="collapse-btn" type="button" title="Ciutkan sidebar" aria-label="Ciutkan sidebar"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="3" width="18" height="18" rx="2" ry="2"/><line x1="9" y1="3" x2="9" y2="21"/></svg></button>
    </div>
    <div class="dsb-side-list">
      <div class="bt-list" id="bot-list"></div>
    </div>
    <div class="dsb-side-foot">
      <img src="/logo.svg" alt="" class="avatar" style="width:34px;height:34px;border-radius:50%">
      <div class="who">
        <div class="name">Alfi</div>
        <div class="sub">Antigravity Pro · agy CLI</div>
      </div>
    </div>
  </aside>
  <main class="dsb-main">
    <div class="dsb-head"><div id="bot-header"></div></div>
    <section id="chat">
      <div id="bot-settings" hidden>
        <div class="set-head">
          <div class="set-preview" id="set-preview"></div>
          <div class="set-who">
            <div class="set-name" id="set-preview-name"></div>
            <div class="set-role" id="set-preview-role"></div>
          </div>
        </div>
        <div class="bt-tabs" role="tablist" aria-label="Avatar">
          <button type="button" class="bt-tab active" id="tab-bot" data-tab="bot">Bot</button>
          <button type="button" class="bt-tab" id="tab-upload" data-tab="upload">Upload</button>
          <button type="button" class="bt-tab-link" id="set-reset-look" title="Kembali ke karakter default bot ini">Reset</button>
        </div>
        <div class="set-tab" id="set-tab-bot">
          <div class="field full"><span>Karakter</span><div class="bt-shapes" id="set-shapes"></div></div>
          <div class="field full"><span>Warna</span><div class="bt-colors" id="set-colors"></div></div>
          <div class="field"><span>Warna custom (hex)</span>
            <span class="color-custom"><input id="set-color" type="color" value="#2FA08C"><code id="set-color-hex"></code></span>
          </div>
        </div>
        <div class="set-tab" id="set-tab-upload" hidden>
          <div class="field full"><span>Foto avatar (gambar/foto sendiri, max 2 MB)</span>
            <input id="set-photo" type="file" accept="image/png,image/jpeg,image/gif,image/webp">
            <p class="note">Foto menggantikan karakter. Hapus foto untuk kembali ke karakter.</p>
          </div>
        </div>
        <div class="sheet-grid">
          <label class="field">Nama
            <input id="set-name" type="text" maxlength="40">
          </label>
          <label class="field">Tagline (karakter bot, tampil di daftar)
            <input id="set-tagline" type="text" maxlength="80" placeholder="cth. Guru yang sabar — materi sulit jadi gampang">
          </label>
          <label class="field">Model
            <select id="set-model"></select>
          </label>
          <label class="field">Effort
            <select id="set-effort"></select>
          </label>
        </div>
        <div class="form-actions">
          <button id="set-save" type="button" class="btn primary">Simpan</button>
          <button id="set-remove-photo" type="button" class="btn danger">Hapus foto (balik ke karakter)</button>
          <button id="set-close" type="button" class="btn">Tutup</button>
        </div>
        <p id="set-status"></p>
      </div>
      <div class="dsb-scroll">
        <div class="dsb-column">
          <div id="messages"></div>
        </div>
      </div>
      <div class="dsb-composer-root">
        <div class="dsb-composer-wrap">
          <form id="composer">
            <label class="attach" title="Lampirkan gambar"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21.44 11.05l-9.19 9.19a6 6 0 0 1-8.49-8.49l9.19-9.19a4 4 0 0 1 5.66 5.66l-9.2 9.19a2 2 0 0 1-2.83-2.83l8.49-8.48"/></svg>
              <input id="image-input" type="file" accept="image/png,image/jpeg,image/gif,image/webp" hidden>
            </label>
            <span class="composer-input"><input id="input" type="text" placeholder="Tulis pesan ke bot…" autocomplete="off"></span>
            <span id="image-preview"></span>
            <button type="submit" title="Kirim" aria-label="Kirim"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><line x1="12" y1="19" x2="12" y2="5"/><polyline points="5 12 12 5 19 12"/></svg></button>
          </form>
          <p id="status"></p>
        </div>
      </div>
    </section>
  </main>
</div>
<script type="module" src="/static/app.js?v=10"></script>
</body>
</html>
